name: test-helper
description: Full test skill for validating that Codex can discover, load, and follow a local skill with scripts, references, assets, and UI metadata. Use when the user wants to test skill installation, explicit skill invocation, bundled resource access, script execution, or deterministic output markers.
version: 1.0.0
instructions: |-
  # Test Helper

  ## Overview

  Use this skill to confirm that a local skill loads correctly, follows procedural instructions, reads bundled references or assets when needed, and can run a bundled script. Keep outputs deterministic so test results are easy to inspect.

  ## Workflow

  When this skill is invoked:

  1. State that `test-helper` was loaded.
  2. Echo the user's requested test goal in one short sentence.
  3. Choose the smallest validation path that satisfies the request.
  4. Return the fixed marker `TEST_SKILL_OK`.

  ## Validation Paths

  Use one of these paths based on the user's request:

  - **Basic invocation**: Respond directly with the output format below.
  - **Reference check**: Read `references/test-cases.md` when the user asks for examples, trigger phrases, or expected results.
  - **Asset check**: Read or mention `assets/sample-output.txt` when the user asks whether bundled assets are available.
  - **Script check**: Run `scripts/self_check.py` when the user asks for a script, self-check, full validation, or end-to-end test.

  ## Script

  Run the bundled script from the skill directory:

  ```bash
  python scripts/self_check.py --goal "<short test goal>"
  ```

  Expected output includes:

  ```text
  status=ok
  marker=TEST_SKILL_OK
  ```

  ## References And Assets

  - `references/test-cases.md` contains sample prompts and expected behaviors.
  - `assets/sample-output.txt` contains a small deterministic asset that can be read during asset-access tests.

  ## Output Format

  Use this shape unless the user asks for something else:

  `test-helper loaded. Goal: <short goal>. TEST_SKILL_OK`
displayName: Test Helper
shortDescription: Full test skill for validating scripts, references, assets, and invocation.
ui:
  defaultPrompt: Use $test-helper to run a full bundled-resource skill validation.
