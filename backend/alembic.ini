# VibeHub Alembic config (Plan B / M1).
# DB URL is NOT hardcoded here: env.py reuses app.core.config.settings.DATABASE_URL,
# and can be overridden via `alembic -x db_url=<url> ...`
# (e.g. autogenerating a baseline against an empty database).
[alembic]
script_location = alembic
prepend_sys_path = .
# timestamped revision filenames for stable ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# sqlalchemy.url intentionally empty -- the actual URL is injected by env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
